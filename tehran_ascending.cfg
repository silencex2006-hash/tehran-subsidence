
# ============================================================
# MintPy Settings - Ascending (Path 130)
# ============================================================

## Data Source
mintpy.load.processor = hyp3

## File Patterns - فقط داده‌های Ascending
mintpy.load.unwFile = tehran_insar_ascending/*/*_unw_phase.tif
mintpy.load.corFile = tehran_insar_ascending/*/*_corr.tif
mintpy.load.demFile = tehran_insar_ascending/*/*_dem.tif
mintpy.load.incAngleFile = tehran_insar_ascending/*/*_lv_theta.tif
mintpy.load.azAngleFile = tehran_insar_ascending/*/*_lv_phi.tif

## Subset (همون محدوده Descending)
mintpy.subset.lalo = 35.6:35.8,51.2:51.6

## Reference Point (همون)
mintpy.reference.lalo = 35.68156,51.53089

## Network
mintpy.networkInversion.minTempCoh = 0.3
mintpy.networkInversion.weightFunc = var

## Unwrap Error
mintpy.unwrapError.method = no

## Tropospheric Correction
mintpy.troposphericDelay.method = height_correlation
mintpy.troposphericDelay.polyOrder = 1

## Deramp
mintpy.deramp = linear

## Topographic
mintpy.topographicResidual = yes
mintpy.topographicResidual.polyOrder = 2
## Maximum coverage options
mintpy.networkInversion.maskDataset = no
mintpy.networkInversion.minRedundancy = 0.5
mintpy.networkInversion.numIfgram = 5
mintpy.networkInversion.waterMaskFile = no

## Fix: disable water mask
mintpy.networkInversion.waterMaskFile = no
mintpy.networkInversion.maskDataset = no
